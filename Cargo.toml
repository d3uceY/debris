[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["d3uceY <onyekwelujesse1234@gmail.com>"]

[workspace.dependencies]
# GPUI ships from the Zed repository, not crates.io. Both crates must resolve to
# one revision or you get confusing type mismatches.
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }

# GPUI's `AssetSource::load` returns `anyhow::Result`, so the app cannot avoid it.
anyhow = "1"

# Every piece of data this app reads is JSON: the shipped catalogues, the settings,
# the custom tweaks, and the extension catalogue. Hand-rolling a parser for any of
# them would be more code and less correct.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `debris-app`'s build script compiles the exe icon into the binary on Windows.
# Already in the graph via GPUI's own `windows-manifest` feature.
embed-resource = "3.0.12"

debris-core = { path = "crates/debris-core" }
debris-backend = { path = "crates/debris-backend" }
debris-ui = { path = "crates/debris-ui" }
