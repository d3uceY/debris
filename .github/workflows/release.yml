name: Release

# Windows only, GitHub only.
#
# The deliverable is one file: a self-contained `debris.exe`. There is nothing to unzip
# and nothing to sit beside it — the icon set, the presets, the system catalogue and the
# PowerShell library are all embedded at build time (`crates/debris-app/build.rs`). It is
# attached to a GitHub Release and to nothing else. There is deliberately no Homebrew
# cask, no winget manifest, no update manifest and no deploy hook.
#
# The tag you push *is* the version. Nothing here computes one:
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# releases v0.1.2 — and the app calls itself 0.1.2 in the status rail, in the exe's
# properties, and in the manifest it was built from.
#
# A manual run is for a commit you have not tagged: it takes the version as an input
# and creates the tag itself, at the commit the run started from.

on:
  push:
    # `v*` and not `*`: a tag is only a release if it is shaped like a version, and the
    # job checks the exact shape before it builds anything.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.2'
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Take the version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # No checkout: on a tag push the tag arrives in the event, so there is no history
      # to read and nothing to compute. A manual run has no tag of its own, so it takes
      # the version as an input and the release step creates the tag.
      - name: Resolve and validate
        id: resolve
        env:
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${PUSHED_TAG:-}"
          if [ -z "${version}" ]; then
            version="${REQUESTED:-}"
          fi
          if [ -z "${version}" ]; then
            echo "::error::no version to release — push a tag, or pass one to the manual run"
            exit 1
          fi

          # Cargo enforces strict semver on `[package].version`, and the stamp below
          # writes this string straight into it. Reject a tag Cargo would refuse here,
          # next to the tag, rather than ten minutes later inside the build.
          if ! printf '%s' "${version}" | grep -qE '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error::'${version}' is not v<major>.<minor>.<patch>, e.g. v0.1.2"
            exit 1
          fi

          echo "Releasing ${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and package (windows)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # Stamping the manifest is what makes the tag, the exe's VERSIONINFO,
      # `CARGO_PKG_VERSION` and the string the status bar shows all agree. Without it
      # the released binary would call itself whatever was checked in.
      - name: Stamp the version into the workspace manifest
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $version = $env:VERSION.TrimStart('v')
          $manifest = Join-Path $PWD 'Cargo.toml'
          $text = Get-Content -LiteralPath $manifest -Raw
          # The first `version = ` line in the root manifest is [workspace.package]'s.
          if ($text -notmatch '(?m)^version = "') { throw "no version line in $manifest" }
          $stamped = [regex]::Replace($text, '(?m)^version = ".*"', "version = `"$version`"", 1)
          # WriteAllText, not Set-Content: no BOM, and no trailing newline invented.
          [System.IO.File]::WriteAllText($manifest, $stamped, [System.Text.UTF8Encoding]::new($false))
          Select-String -LiteralPath $manifest -Pattern '^version' | Select-Object -First 1 | ForEach-Object Line

      - name: Build
        run: cargo build --release -p debris-app

      # The artifact is the exe itself, not an archive of it: a release asset you can
      # download and run, with no unzip step in between.
      - name: Upload the exe
        uses: actions/upload-artifact@v7
        with:
          name: debris-windows-x64
          path: target/release/debris.exe
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download the exe
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      # The body is the commit list since the last release, and each commit is credited
      # with a *handle*, not the name git recorded. Only the API knows which account an
      # email belongs to, so the handle comes from `author.login`; `@d3uceY` notifies an
      # account and `d3uceY` typed from `.gitconfig` notifies nobody. A commit whose email
      # GitHub cannot link has no handle, and is listed without one rather than with a
      # name dressed up as one.
      - name: Build the changelog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          # A native command that fails is data here, not an exception: the 404 below is
          # the expected answer to "what was the last release?" on a first release.
          $PSNativeCommandUseErrorActionPreference = $false

          $previous = gh api "repos/$env:REPO/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -ne 0 -or $previous -eq $env:TAG) { $previous = '' }

          # One call for the whole range. `github.sha` is the head, not the tag: a manual
          # run creates the tag after this step, so the tag may not exist yet.
          if ($previous) {
            $json = gh api "repos/$env:REPO/compare/$previous...$env:SHA"
          } else {
            $json = gh api "repos/$env:REPO/commits?sha=$env:SHA&per_page=100"
          }
          if ($LASTEXITCODE -ne 0) { throw "could not read the commit list" }

          $commits = @($json | ConvertFrom-Json)
          if ($previous) { $commits = @($commits[0].commits) }
          if ($commits.Count -eq 0) { throw "no commits found for $env:SHA" }

          $lines = @('## Commits', '')
          foreach ($commit in $commits) {
            # Subject only: the body of a commit is not release-notes material.
            $subject = ($commit.commit.message -split "`n")[0].Trim()
            $short = $commit.sha.Substring(0, 7)
            $handle = $commit.author.login
            if ($handle) {
              $lines += "- $subject (@$handle, $short)"
            } else {
              $lines += "- $subject ($short)"
            }
          }
          if ($previous) {
            $lines += ''
            $lines += "**Full changelog**: https://github.com/$env:REPO/compare/$previous...$env:TAG"
          }

          $path = Join-Path $env:GITHUB_WORKSPACE 'changelog.md'
          [IO.Directory]::CreateDirectory($env:GITHUB_WORKSPACE) | Out-Null
          # No BOM and no `-Encoding` guess: the body is sent as UTF-8 text, and a BOM
          # renders as a stray character at the top of the release.
          [IO.File]::WriteAllText($path, ($lines -join "`n"), [Text.UTF8Encoding]::new($false))
          Get-Content -LiteralPath $path | Select-Object -First 6

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: debris ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: ${{ github.workspace }}/changelog.md
          make_latest: "true"
          draft: false
          files: dist/debris.exe
